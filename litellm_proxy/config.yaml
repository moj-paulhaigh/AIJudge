model_list:
  - model_name: azure-gpt-5.6-luna
    litellm_params:
      model: azure/gpt-5.6-luna
      api_key: os.environ/AZURE_API_KEY
      api_base: os.environ/AZURE_API_BASE
      api_version: os.environ/AZURE_API_VERSION

litellm_settings:
  # Registers our async logging + pre-call blocklist hook. Must be run with
  # this directory (litellm_proxy/) as the working directory so the
  # "judge_logger" module resolves.
  callbacks: ["judge_logger.judge_callback"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
